[project]
name = "cua"
version = "0.1.0"
description = "Computer-Use Automation System — record once, replay deterministically"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "playwright>=1.44",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "mypy>=1.10", "ruff>=0.4"]

[project.scripts]
cua = "cua.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 180

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
